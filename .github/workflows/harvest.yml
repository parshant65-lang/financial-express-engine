name: Harvest Financial Express Archive

on:
  schedule:
    # Heartbeat cron every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch:

concurrency:
  group: fe-harvest-archive
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Harvester Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Financial Express Archive Harvester
        env:
          VAULT_PAT: ${{ secrets.VAULT_PAT }}
        run: python harvester.py
